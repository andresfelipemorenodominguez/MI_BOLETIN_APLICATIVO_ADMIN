<!DOCTYPE html>
<html lang="es" class="page-dashboard">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiBoletín Estudiante</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/panel-dynamic.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/branding-panel.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tema oscuro aplicado ANTES de pintar para evitar flash blanco -->
    <script>
        (function(){
            var saved = localStorage.getItem('miboletin_dark_mode');
            var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'true' || (saved === null && sysDark)) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body>

<button class="hamburger" id="hamburger-btn" aria-label="Menú">
    <i class="fas fa-bars"></i>
</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="school-brand logo-btn" aria-label="Institución">
                <img id="school-logo" class="school-logo" src="" alt="" style="display:none">
                <i id="school-logo-fallback" class="fas fa-school logo-icon school-logo-fallback"></i>
                <div class="school-brand-text">
                    <span class="school-name" id="school-name">MiBoletín</span>
                    <span class="school-lema" id="school-lema"></span>
                    <span class="school-role-label" data-role="estudiante">Estudiante</span>
                </div>
            </div>
        </div>

        <nav class="sidebar-nav" aria-label="Navegación principal">
            <ul class="nav-list">
                <li class="nav-item nav-section-label">
                    <span class="text-sm text-gray-500">General</span>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link active" data-section="inicio">
                        <i class="fas fa-home nav-icon"></i>
                        <span class="nav-text">Inicio</span>
                    </a>
                </li>

                <li class="nav-item nav-section-label">
                    <span class="text-sm text-gray-500">Académico</span>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="notas">
                        <i class="fas fa-graduation-cap nav-icon"></i>
                        <span class="nav-text">Mis Notas</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="desempeno">
                        <i class="fas fa-chart-bar nav-icon"></i>
                        <span class="nav-text">Desempeño</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="asistencia">
                        <i class="fas fa-calendar-check nav-icon"></i>
                        <span class="nav-text">Asistencia</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="material">
                        <i class="fas fa-folder-open nav-icon"></i>
                        <span class="nav-text">Material</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="observador">
                        <i class="fas fa-eye nav-icon"></i>
                        <span class="nav-text">Observador</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="agenda">
                        <i class="fas fa-calendar-alt nav-icon"></i>
                        <span class="nav-text">Agenda</span>
                    </a>
                </li>

                <li class="nav-item nav-section-label">
                    <span class="text-sm text-gray-500">Comunicación</span>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="chat">
                        <i class="fas fa-comments nav-icon"></i>
                        <span class="nav-text">Chat</span>
                    </a>
                </li>

                <li class="nav-item nav-section-label">
                    <span class="text-sm text-gray-500">Participación</span>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="votaciones">
                        <i class="fas fa-vote-yea nav-icon"></i>
                        <span class="nav-text">Votaciones</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div data-sb-footer class="sb-footer">
            <div class="sb-footer-inner">
                <div class="sb-avatar" id="sb-avatar">
                    <img src="https://ui-avatars.com/api/?name={{ nombre|urlencode }}&background=003366&color=fff&size=64" class="sb-avatar-img" alt="avatar" id="sb-avatar-img">
                </div>
                <div class="sb-user-info">
                    <span id="sb-user-name" class="sb-user-name">{{ nombre }}</span>
                    <span id="sb-user-email" class="sb-user-email">{{ codigo }}</span>
                </div>
                <div class="profile-sidebar-actions">
                    <button type="button" id="profile-btn" class="sb-profile-btn" title="Ver perfil">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div id="panel-content" class="content-wrapper"></div>
    </main>
</div>

<!-- Modal perfil — split professional layout -->
<style>
#profile-modal-overlay { z-index: 1000; }
#profile-modal {
    position: relative;
    max-width: 760px;
    width: 95%;
    padding: 0;
    border-radius: 16px;
    border: 1px solid var(--gray-200);
    box-shadow: 0 16px 48px rgba(0,0,0,0.12);
    background: #fff;
    overflow: visible;
    max-height: 92vh;
}
html.dark-mode #profile-modal {
    background: var(--dm-surface);
    border-color: var(--dm-border);
    box-shadow: 0 16px 48px rgba(0,0,0,0.45);
}
#close-profile-modal {
    position: absolute;
    top: 14px; right: 14px;
    z-index: 10;
    background: var(--gray-100);
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: none;
    color: var(--gray-500);
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s, color 0.15s;
}
html.dark-mode #close-profile-modal { background: var(--dm-surface2); color: var(--dm-text-muted); }
#close-profile-modal:hover { background: var(--error); color: #fff; }
.profile-split-body  { padding:0; margin:0; overflow:hidden; border-radius:16px; max-height:92vh; overflow-y:auto; }
.profile-split-grid  { display:grid; grid-template-columns: 1fr 240px; }
@media(max-width:680px){ .profile-split-grid { display:flex; flex-direction:column-reverse; } }
.profile-left-col    { padding:28px; border-right:1px solid var(--gray-200); display:flex; flex-direction:column; background:#fff; overflow-y:auto; }
html.dark-mode .profile-left-col { background:var(--dm-surface); border-right-color:var(--dm-border); }
.profile-title-custom{ margin:0 0 20px!important; font-size:17px; font-weight:700; color:var(--accent); display:flex; align-items:center; gap:8px; background:transparent!important; border:none!important; }
.profile-right-col   { display:flex; flex-direction:column; align-items:center; padding:24px 18px; background:var(--gray-50); border-left:1px solid var(--gray-200); }
html.dark-mode .profile-right-col { background:var(--dm-surface2); border-left-color:var(--dm-border); }
.profile-avatar-img  { width:80px; height:80px; border-radius:50%; object-fit:cover; border:3px solid var(--gray-200); display:block; }
html.dark-mode .profile-avatar-img { border-color:var(--dm-border); }
.profile-info-name   { margin:10px 0 2px; font-size:.92rem; font-weight:700; color:var(--gray-800); text-align:center; }
html.dark-mode .profile-info-name  { color:var(--dm-text); }
.profile-info-email  { margin:0 0 3px; color:var(--gray-500); font-size:.76rem; text-align:center; }
html.dark-mode .profile-info-email { color:var(--dm-text-muted); }
.profile-info-role   { margin:0; color:var(--accent); font-size:.73rem; font-weight:600; text-align:center; }
.profile-dark-mode-row { width:100%; display:flex; justify-content:space-between; align-items:center; padding:10px 0; margin:12px 0; border-top:1px solid var(--gray-200); border-bottom:1px solid var(--gray-200); }
html.dark-mode .profile-dark-mode-row { border-color:var(--dm-border); }
.profile-dark-mode-label { font-size:.82rem; font-weight:500; color:var(--gray-700); display:flex; align-items:center; gap:6px; }
html.dark-mode .profile-dark-mode-label { color:var(--dm-text-muted); }
.profile-action-btn.btn-logout { color:#fff; background:var(--error); border-color:var(--error); }
.profile-action-btn.btn-logout:hover { background:var(--error-dark); border-color:var(--error-dark); }
</style>

<div class="modal-overlay" id="profile-modal-overlay">
    <div class="modal" id="profile-modal">
        <button id="close-profile-modal"><i class="fas fa-times"></i></button>
        <div class="modal-body profile-split-body">
            <div class="profile-split-grid">

                <!-- LEFT: info -->
                <div class="profile-left-col">
                    <h2 class="profile-title-custom">
                        <i class="fas fa-user-circle"></i> Mi Perfil
                    </h2>
                    <div id="profile-info-list" class="profile-info-list"></div>

                    <!-- Editar perfil inline -->
                    <div id="est-edit-form" style="display:none;margin-top:12px;">
                        <div class="form-group">
                            <label class="form-label" for="editName">Nombre completo</label>
                            <input type="text" id="editName" class="form-input" value="{{ nombre }}">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="editEmail">Correo electrónico</label>
                            <input type="email" id="editEmail" class="form-input" placeholder="correo@ejemplo.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="edit-fecha-nac">Fecha de nacimiento</label>
                            <input type="date" id="edit-fecha-nac" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="edit-lugar-nac">Lugar de nacimiento</label>
                            <input type="text" id="edit-lugar-nac" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="edit-genero">Género</label>
                            <select id="edit-genero" class="form-input">
                                <option value="">Seleccionar</option>
                                <option value="masculino">Masculino</option>
                                <option value="femenino">Femenino</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="edit-direccion">Dirección de residencia</label>
                            <input type="text" id="edit-direccion" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="edit-eps">EPS</label>
                            <input type="text" id="edit-eps" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="edit-rh">Grupo sanguíneo</label>
                            <input type="text" id="edit-rh" class="form-input" placeholder="Ej. O+">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="edit-alergias">Alergias</label>
                            <textarea id="edit-alergias" class="form-input" rows="2"></textarea>
                        </div>
                        <div style="display:flex;gap:8px;margin-top:8px;">
                            <button type="button" class="btn-secondary" id="cancel-profile" style="flex:1;">Cancelar</button>
                            <button type="button" class="btn-primary" id="save-profile" style="flex:1;">
                                <i class="fas fa-save"></i> Guardar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- RIGHT: avatar + acciones -->
                <div class="profile-right-col">
                    <img id="profile-avatar-img"
                         src="https://ui-avatars.com/api/?name={{ nombre|urlencode }}&background=003366&color=fff&size=120"
                         alt="Avatar" class="profile-avatar-img">

                    <h3 id="profile-view-name" class="profile-info-name">{{ nombre }}</h3>
                    <p id="profile-view-email" class="profile-info-email">{{ codigo }}</p>
                    <p id="profile-view-role" class="profile-info-role">Estudiante</p>

                    <div class="profile-dark-mode-row">
                        <label for="dark-mode-toggle" class="profile-dark-mode-label">
                            <i class="fas fa-moon"></i> Modo Oscuro
                        </label>
                        <label class="dark-toggle-switch">
                            <input type="checkbox" id="dark-mode-toggle">
                            <span class="dark-toggle-track"></span>
                        </label>
                    </div>

                    <div style="display:flex;flex-direction:column;width:100%;gap:7px;margin-top:4px;">
                        <label class="profile-action-btn">
                            <i class="fas fa-camera"></i> Cambiar foto
                            <input type="file" id="profile-photo-input" accept="image/png,image/jpeg,image/webp" hidden>
                        </label>
                        <button type="button" class="profile-action-btn" id="est-open-edit">
                            <i class="fas fa-user-edit"></i> Editar perfil
                        </button>
                        <button type="button" class="profile-action-btn" id="open-password-modal">
                            <i class="fas fa-key"></i> Cambiar contraseña
                        </button>
                        <button type="button" class="profile-action-btn" onclick="window.location.href='/constancia/pdf'">
                            <i class="fas fa-file-certificate"></i> Descargar Constancia
                        </button>
                        <button type="button" class="profile-action-btn btn-logout" onclick="window.location.href='/logout'">
                            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Modal editar perfil (reemplazado por inline en perfil) -->

<!-- Modal contraseña -->
<div class="modal-overlay" id="password-modal-overlay">
    <div class="modal" style="max-width:440px;width:95%;">
        <div class="modal-header">
            <h2 class="modal-title"><i class="fas fa-key"></i> Cambiar Contraseña</h2>
            <button type="button" class="modal-close" id="close-password-modal" aria-label="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label" for="currentPassword">Contraseña actual</label>
                <input type="password" id="currentPassword" class="form-input" placeholder="Contraseña actual" autocomplete="current-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="newPassword">Nueva contraseña</label>
                <input type="password" id="newPassword" class="form-input" placeholder="Nueva contraseña" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" class="form-input" placeholder="Confirmar" autocomplete="new-password">
            </div>
            <p id="pw-msg" style="font-size:13px;min-height:18px;margin:0;"></p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" id="cancel-password-modal">Cancelar</button>
            <button type="button" class="btn-primary" id="savePassword">
                <i class="fas fa-save"></i> Cambiar
            </button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='script/panel-shell.js') }}"></script>
<script src="{{ url_for('static', filename='script/panel-branding.js') }}"></script>
<script src="{{ url_for('static', filename='script/profile-panel.js') }}"></script>
<script src="{{ url_for('static', filename='script/chat-shared.js') }}"></script>
<script src="{{ url_for('static', filename='script/estudiante.js') }}"></script>
</body>
</html>
